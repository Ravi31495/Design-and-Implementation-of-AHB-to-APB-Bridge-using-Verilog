<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<rect width="1100" height="430" fill="white"/>
<text x="550" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">AHB-to-APB Bridge Architecture</text>
<rect x="40" y="125" width="190" height="150" rx="12" fill="#eef" stroke="#334" stroke-width="2"/>
<text x="135" y="165" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">AHB Master</text>
<text x="135" y="198" text-anchor="middle" font-family="Arial" font-size="14">HADDR</text><text x="135" y="220" text-anchor="middle" font-family="Arial" font-size="14">HTRANS / HWRITE</text><text x="135" y="242" text-anchor="middle" font-family="Arial" font-size="14">HWDATA / HRDATA</text>
<rect x="300" y="100" width="220" height="200" rx="12" fill="#efe" stroke="#363" stroke-width="2"/>
<text x="410" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">AHB Slave</text><text x="410" y="170" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Interface</text><text x="410" y="205" text-anchor="middle" font-family="Arial" font-size="14">Capture / pipeline</text><text x="410" y="228" text-anchor="middle" font-family="Arial" font-size="14">Valid detection</text><text x="410" y="251" text-anchor="middle" font-family="Arial" font-size="14">Address decoding</text>
<rect x="590" y="100" width="220" height="200" rx="12" fill="#ffe" stroke="#663" stroke-width="2"/>
<text x="700" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">APB Controller</text><text x="700" y="178" text-anchor="middle" font-family="Arial" font-size="17">FSM</text><text x="700" y="215" text-anchor="middle" font-family="Arial" font-size="14">IDLE → SETUP</text><text x="700" y="238" text-anchor="middle" font-family="Arial" font-size="14">→ ENABLE</text><text x="700" y="268" text-anchor="middle" font-family="Arial" font-size="14">PSEL / PENABLE / PWRITE</text>
<rect x="870" y="125" width="190" height="150" rx="12" fill="#eef" stroke="#334" stroke-width="2"/>
<text x="965" y="165" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">APB</text><text x="965" y="195" text-anchor="middle" font-family="Arial" font-size="17">Peripheral</text><text x="965" y="225" text-anchor="middle" font-family="Arial" font-size="14">PADDR / PWDATA</text><text x="965" y="247" text-anchor="middle" font-family="Arial" font-size="14">PRDATA</text>
<line x1="230" y1="200" x2="300" y2="200" stroke="#222" stroke-width="3" marker-end="url(#a)"/><line x1="520" y1="200" x2="590" y2="200" stroke="#222" stroke-width="3" marker-end="url(#a)"/><line x1="810" y1="200" x2="870" y2="200" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<text x="265" y="185" text-anchor="middle" font-family="Arial" font-size="12">AHB</text><text x="555" y="185" text-anchor="middle" font-family="Arial" font-size="12">bridge control</text><text x="840" y="185" text-anchor="middle" font-family="Arial" font-size="12">APB</text>
<text x="550" y="365" text-anchor="middle" font-family="Arial" font-size="15">Three decoded APB windows: 0x8000_0000–0x83FF_FFFF, 0x8400_0000–0x87FF_FFFF, 0x8800_0000–0x8BFF_FFFF</text>
</svg>
